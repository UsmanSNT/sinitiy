name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/sinity
            git fetch origin main
            git reset --hard origin/main

            # --- Backend (API) ---
            pnpm install --frozen-lockfile
            cd apps/api
            npx prisma generate
            npx prisma migrate deploy
            pm2 restart sinity-api
            cd /opt/sinity

            # --- Frontend (Expo web export) ---
            cd apps/mobile
            npm install
            EXPO_PUBLIC_API_URL="http://49.247.205.179:8090/api" npx expo export -p web --output-dir dist-web
            rm -rf /var/www/sinity-web/*
            cp -r dist-web/. /var/www/sinity-web/

            echo "Deploy finished: $(date)"
